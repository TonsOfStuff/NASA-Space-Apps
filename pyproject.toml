[project]
name = "spaceapps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bitofbeans", email = "quobits@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pathlib>=1.0.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
spaceapps = "spaceapps:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
